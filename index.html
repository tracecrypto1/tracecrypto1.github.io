<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nick Matthew</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
      :root {
        --custom-orange: #95abab; /* Standard logo teal */
        --custom-red: #5a6e6e;    /* deeper teal */
        font-family: "Georgia", serif;
      }

      body {
        background-color: #0a0c0d; /* Standard logo near-black */
        color: #d4d8d9;            /* off-white body text */
      }

      /* Convert every image to black and white */
      img {
        filter: grayscale(100%);
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col min-h-screen">
      <!-- Main Content -->
      <div class="p-[25px] w-full md:w-1/2 min-w-min">
        <!-- Headshot -->
        <div class="w-48 mb-6">
          <img src="/headshot.jpeg" alt="Nick Matthew" class="w-48 rounded-lg shadow-md" />
        </div>
      </div>
    </div>
  </body>
</html>
